name: secret-check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Dump secret fingerprints
        env:
          KS: ${{ secrets.KEYSTORE }}
          KSP: ${{ secrets.KEYSTORE_PASSWORD }}
          KA: ${{ secrets.KEY_ALIAS }}
          KP: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "KEYSTORE_len=${#KS}"
          echo "KEYSTORE_decoded_sha256=$(printf %s "$KS" | base64 -d 2>/dev/null | sha256sum | cut -d' ' -f1)"
          echo "KEYSTORE_PASSWORD_len=${#KSP}"
          echo "KEYSTORE_PASSWORD_sha256=$(printf %s "$KSP" | sha256sum | cut -d' ' -f1)"
          echo "KEY_ALIAS_len=${#KA}"
          echo "KEY_ALIAS_value=${KA}"
          echo "KEY_PASSWORD_len=${#KP}"
          echo "KEY_PASSWORD_sha256=$(printf %s "$KP" | sha256sum | cut -d' ' -f1)"
